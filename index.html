<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouquet Fine Wine - Carte Malaisie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #F4F3EF;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(210, 205, 195, 0.6);
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      --primary-wine: #58111A;
      --accent-gold: #C5A059;
      --text-dark: #1D1D1F;
      --text-muted: #86868B;
      --font-title: 'Playfair Display', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;

      --pastel-green: #E2F0D9;
      --pastel-orange: #FCE4D6;
      --pastel-red: #FADBD8;
      --pastel-blue: #D9E1F2;
      --pastel-none: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-color); font-family: var(--font-body); color: var(--text-dark); width: 100vw; height: 100vh; overflow: hidden; position: relative; }

    header {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 16px; padding: 10px 22px;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 40px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .brand-title { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .brand-title h1 { font-family: var(--font-title); font-size: 18px; font-weight: 600; color: var(--primary-wine); }
    .badge-country { background: var(--accent-gold); color: white; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; }

    .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); background: rgba(0,0,0,0.04); padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #34C759; }
    .status-dot.syncing { background: #FF9500; }

    .toolbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn { background: rgba(240, 238, 233, 0.8); border: 1px solid transparent; color: var(--text-dark); padding: 7px 12px; border-radius: 18px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .btn:hover { background: white; border-color: rgba(0,0,0,0.1); }
    .btn-primary { background: var(--primary-wine); color: white; }
    .btn-active { background: var(--accent-gold) !important; color: white !important; }

    #workspace { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    svg#connections-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    path.connection-line { fill: none; stroke: var(--accent-gold); stroke-width: 2px; stroke-dasharray: 6 4; opacity: 0.45; }

    .draggable-card { position: absolute; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 16px; box-shadow: var(--card-shadow); cursor: grab; z-index: 10; transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
    .draggable-card:hover { z-index: 45; transform: scale(1.03); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }

    /* Surbrillance dorée Mode Relier */
    .draggable-card.selected-for-link { border: 3px solid var(--accent-gold) !important; box-shadow: 0 0 20px rgba(197, 160, 89, 0.5) !important; transform: scale(1.05); z-index: 50 !important; }

    .domain-card { padding: 8px 12px; min-width: 135px; max-width: 165px; text-align: center; border-top: 3px solid var(--primary-wine); border-radius: 14px; }
    .domain-region { font-size: 8px; font-weight: 600; text-transform: uppercase; color: var(--accent-gold); margin-bottom: 2px; }
    .domain-name { font-family: var(--font-title); font-size: 13px; font-weight: 600; color: var(--primary-wine); }

    .importer-card { padding: 10px 14px; width: 220px; display: flex; align-items: center; gap: 12px; border-radius: 16px; border-left: 5px solid transparent; }
    .importer-card[data-color="green"] { background: var(--pastel-green); border-left-color: #2e7d32; }
    .importer-card[data-color="orange"] { background: var(--pastel-orange); border-left-color: #e65100; }
    .importer-card[data-color="red"] { background: var(--pastel-red); border-left-color: #c62828; }
    .importer-card[data-color="blue"] { background: var(--pastel-blue); border-left-color: #1565c0; }
    .importer-card[data-color="none"] { background: var(--card-bg); border-left-color: transparent; }

    .importer-avatar { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; background: #E8E5DF; flex-shrink: 0; }
    
    .importer-info-container { flex-grow: 1; overflow: hidden; }
    
    /* Nom de l'entreprise sur 2 lignes max */
    .importer-company { 
      font-weight: 600; font-size: 13px; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      white-space: normal; overflow: hidden; text-overflow: ellipsis; 
    }
    
    /* Activité seule (en une seule ligne) */
    .importer-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bulle d'Aperçu (Notes et Domaines) avec alignement texte à gauche */
    .mini-tooltip {
      position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.98); border: 1px solid var(--card-border); border-radius: 12px;
      padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); width: 240px;
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.2s ease 0.4s; z-index: 100;
      text-align: left;
    }
    .importer-card:hover .mini-tooltip { opacity: 1; visibility: visible; }
    .tooltip-title { font-size: 9px; color: var(--accent-gold); font-weight: 700; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .tooltip-text { font-size: 11px; color: var(--text-dark); margin-bottom: 8px; line-height: 1.3; }
    .tooltip-text:last-child { margin-bottom: 0; }

    .card-actions { position: absolute; top: -8px; right: -8px; display: none; gap: 4px; z-index: 15; }
    .draggable-card:hover .card-actions { display: flex; }
    .btn-icon { width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.7); color: white; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Modale Complète */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: white; width: 85vw; max-width: 900px; border-radius: 24px; position: relative; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }

    .modal-header-banner { width: 100%; padding: 20px 28px; background: #F8F7F4; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; gap: 20px; border-top-left-radius: 24px; border-top-right-radius: 24px; }
    .modal-banner-avatar { width: 65px; height: 65px; border-radius: 14px; object-fit: cover; border: 2px solid var(--accent-gold); flex-shrink: 0; background: white; }
    .modal-banner-info { flex-grow: 1; }
    .modal-banner-info h2 { font-family: var(--font-title); color: var(--primary-wine); font-size: 22px; font-weight: 700; }
    .modal-banner-info p { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

    .modal-body-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 28px; }

    .color-picker-group { display: flex; gap: 10px; margin-top: 6px; }
    .color-option { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
    .color-option:hover { transform: scale(1.15); }
    .color-option.selected { border-color: var(--primary-wine); transform: scale(1.15); }
    .color-option[data-color="green"] { background: var(--pastel-green); }
    .color-option[data-color="orange"] { background: var(--pastel-orange); }
    .color-option[data-color="red"] { background: var(--pastel-red); }
    .color-option[data-color="blue"] { background: var(--pastel-blue); }
    .color-option[data-color="none"] { background: #E0E0E0; }

    .info-row { margin-bottom: 10px; }
    .info-row label { display: block; font-size: 10px; text-transform: uppercase; color: var(--accent-gold); font-weight: 600; margin-bottom: 4px; }
    .modal-field-edit { width: 100%; font-size: 13px; background: #F8F7F4; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.08); font-family: inherit; outline: none; }
    .modal-field-edit:focus { border-color: var(--accent-gold); background: white; }

    .modal-close { position: absolute; top: 16px; right: 20px; background: rgba(0,0,0,0.06); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; z-index: 10; }

    #linking-banner { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-gold); color: white; padding: 10px 24px; border-radius: 20px; font-size: 13px; z-index: 90; display: none; }
    #file-input { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <h1>Bouquet Fine Wine</h1>
      <span class="badge-country">Malaisie</span>
    </div>

    <div class="sync-indicator">
      <div class="status-dot" id="sync-dot"></div>
      <span id="sync-text">Synchro Cloud...</span>
    </div>

    <div class="toolbar-actions">
      <button class="btn" onclick="openAddModal('domain')"><span>+</span> Domaine</button>
      <button class="btn" onclick="openAddModal('importer')"><span>+</span> Importateur</button>
      <button class="btn" id="btn-toggle-link" onclick="toggleLinkingMode()">🔗 Mode Relier</button>
      <button class="btn" onclick="autoLayout()">✨ Re-disposer</button>
      <button class="btn" onclick="exportData()">💾 Exporter JSON</button>
      <button class="btn" onclick="triggerJSONImport()">📂 Importer JSON</button>
    </div>
  </header>

  <div id="workspace">
    <svg id="connections-layer"></svg>
  </div>

  <div id="linking-banner">Mode Relier Actif : Cliquez sur un élément puis sur un autre pour les relier/délier</div>

  <div class="modal-overlay" id="info-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">✕</button>
      
      <div class="modal-header-banner">
        <img src="" id="m-avatar" class="modal-banner-avatar" alt="Logo">
        <div class="modal-banner-info">
          <h2 id="m-company-title">Entreprise</h2>
          <p id="m-contact-title">Activité</p>
        </div>
      </div>

      <div class="modal-body-layout">
        <div>
          <div class="info-row">
            <label>Couleur Pastel du Statut</label>
            <div class="color-picker-group">
              <div class="color-option" data-color="green" title="Vert" onclick="selectColor('green')"></div>
              <div class="color-option" data-color="orange" title="Orange" onclick="selectColor('orange')"></div>
              <div class="color-option" data-color="red" title="Rouge" onclick="selectColor('red')"></div>
              <div class="color-option" data-color="blue" title="Bleu" onclick="selectColor('blue')"></div>
              <div class="color-option" data-color="none" title="Neutre" onclick="selectColor('none')"></div>
            </div>
            <input type="hidden" id="m-input-color" value="none">
          </div>

          <div class="info-row"><label>Lien Photo / Logo</label><input type="text" id="m-input-avatar" class="modal-field-edit" placeholder="https://lh3.googleusercontent.com/d/..." onchange="saveModalChanges()"></div>
          <div class="info-row"><label>Entreprise</label><input type="text" id="m-input-company" class="modal-field-edit" onchange="saveModalChanges()"></div>
          <div class="info-row"><label>Contact (Nom)</label><input type="text" id="m-input-contact" class="modal-field-edit" onchange="saveModalChanges()"></div>
          <div class="info-row"><label>Activité</label><input type="text" id="m-input-activity" class="modal-field-edit" onchange="saveModalChanges()"></div>
          <div class="info-row"><label>Email</label><input type="email" id="m-input-email" class="modal-field-edit" onchange="saveModalChanges()"></div>
          <div class="info-row"><label>Téléphone</label><input type="text" id="m-input-phone" class="modal-field-edit" onchange="saveModalChanges()"></div>
          <div class="info-row"><label>Remarque / Notes</label><textarea id="m-input-notes" rows="2" class="modal-field-edit" onchange="saveModalChanges()"></textarea></div>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div class="info-row" style="flex-grow: 1; display: flex; flex-direction: column;">
            <label style="font-size: 11px; font-weight: 700;">🍷 DOMAINES ASSOCIÉS</label>
            <textarea id="m-input-domains" class="modal-field-edit" style="flex-grow: 1; min-height: 300px; resize: vertical;" placeholder="Saisir les domaines gérés..." onchange="saveModalChanges()"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" onchange="handleFileSelect(event)">

  <script>
    const JSONBIN_BIN_ID = "6ace1c3eac6210605a230f14";
    const JSONBIN_API_KEY = "$2a$10$w85I3zYfW8X2qG3L7s/g2.1wVj5sZ8J";

    let state = { domains: [], importers: [], links: [] };
    let activeModalId = null;
    let linkingSource = null; 
    let isLinkingMode = false;

    window.onload = async function initApp() {
      await loadData();
      window.addEventListener('resize', renderConnections);
    };

    async function loadData() {
      updateSyncStatus('syncing', 'Chargement...');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.record && (data.record.domains || data.record.importers)) {
            state = data.record;
            state.links = state.links || [];
            localStorage.setItem('bouquet_backup', JSON.stringify(state));
            renderWorkspace();
            updateSyncStatus('online', 'En direct (Cloud)');
            return;
          }
        }
      } catch (e) { console.warn("Erreur Cloud..."); }
      
      const localData = localStorage.getItem('bouquet_backup');
      if (localData) {
        state = JSON.parse(localData);
        state.links = state.links || [];
        updateSyncStatus('online', 'Secours Local');
      } else {
        updateSyncStatus('online', 'Nouvelle Carte');
      }
      renderWorkspace();
    }

    async function saveToCloud() {
      localStorage.setItem('bouquet_backup', JSON.stringify(state));
      updateSyncStatus('syncing', 'Sauvegarde...');
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
          body: JSON.stringify(state)
        });
        updateSyncStatus('online', 'En direct (Cloud)');
      } catch (e) {
        updateSyncStatus('syncing', 'Erreur (Sauvé en local)');
      }
    }

    function updateSyncStatus(status, text) {
      document.getElementById('sync-text').innerText = text;
      document.getElementById('sync-dot').className = 'status-dot ' + (status === 'syncing' ? 'syncing' : '');
    }

    function renderWorkspace() {
      const ws = document.getElementById('workspace');
      document.querySelectorAll('.draggable-card').forEach(el => el.remove());

      state.domains.forEach(d => {
        const el = document.createElement('div');
        el.className = 'draggable-card domain-card';
        el.id = `card-${d.id}`;
        el.style.left = `${d.x}px`;
        el.style.top = `${d.y}px`;
        
        if (linkingSource && linkingSource.id === d.id) el.classList.add('selected-for-link');

        el.innerHTML = `
          <div class="domain-region">${d.region || 'Domaine'}</div>
          <div class="domain-name">${d.name}</div>
          <div class="card-actions"><button class="btn-icon" onclick="deleteItem('domain', '${d.id}', event)">✕</button></div>
        `;

        el.onclick = (e) => {
          if (e.target.closest('.btn-icon')) return;
          if (el.dataset.justDragged === "true") return; 
          
          if (isLinkingMode) handleLinkingClick(d.id, 'domain');
        };

        makeDraggable(el, d);
        ws.appendChild(el);
      });

      state.importers.forEach(imp => {
        const el = document.createElement('div');
        el.className = 'draggable-card importer-card';
        el.id = `card-${imp.id}`;
        el.style.left = `${imp.x}px`;
        el.style.top = `${imp.y}px`;
        el.setAttribute('data-color', imp.color || 'none');
        
        if (linkingSource && linkingSource.id === imp.id) el.classList.add('selected-for-link');

        const avatarUrl = imp.avatar || 'https://via.placeholder.com/50?text=Logo';
        
        const notesPreview = imp.notes ? (imp.notes.length > 60 ? imp.notes.substring(0,60)+'...' : imp.notes) : '-';
        const domainsPreview = imp.domainsText ? (imp.domainsText.length > 60 ? imp.domainsText.substring(0,60)+'...' : imp.domainsText) : '-';

        el.innerHTML = `
          <img src="${avatarUrl}" class="importer-avatar" onerror="this.src='https://via.placeholder.com/50?text=Logo'">
          <div class="importer-info-container">
            <div class="importer-company">${imp.company || 'Sans nom'}</div>
            <div class="importer-subtitle">${imp.activity || ''}</div>
          </div>
          <div class="mini-tooltip">
            <div class="tooltip-title">📝 Remarques / Notes</div>
            <div class="tooltip-text">${notesPreview}</div>
            <div class="tooltip-title">🍷 Domaines associés</div>
            <div class="tooltip-text">${domainsPreview}</div>
            <div class="tooltip-text" style="color:var(--text-muted); font-size:10px; margin-top:8px;">(Cliquez pour ouvrir la fiche)</div>
          </div>
          <div class="card-actions"><button class="btn-icon" onclick="deleteItem('importer', '${imp.id}', event)">✕</button></div>
        `;

        el.onclick = (e) => {
          if (e.target.closest('.btn-icon')) return;
          if (el.dataset.justDragged === "true") return; // Si la carte vient d'être glissée, on annule le clic

          if (isLinkingMode) handleLinkingClick(imp.id, 'importer');
          else openModal(imp.id);
        };

        makeDraggable(el, imp);
        ws.appendChild(el);
      });

      renderConnections();
    }

    // Nouveau système de détection Glisser vs Clic (Infaillible)
    function makeDraggable(el, item) {
      let isDragging = false, startX, startY;
      el.dataset.justDragged = "false";

      el.addEventListener('mousedown', e => {
        if (e.target.closest('.btn-icon')) return;
        isDragging = true;
        el.dataset.justDragged = "false";
        
        startX = e.clientX - item.x; 
        startY = e.clientY - item.y;
        el.style.zIndex = 100;
      });

      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        el.dataset.justDragged = "true"; // Dès que ça bouge, ce n'est plus un clic
        item.x = e.clientX - startX; 
        item.y = e.clientY - startY;
        el.style.left = `${item.x}px`; 
        el.style.top = `${item.y}px`;
        renderConnections();
      });

      window.addEventListener('mouseup', e => {
        if (isDragging) {
          isDragging = false;
          el.style.zIndex = 10;
          if (el.dataset.justDragged === "true") {
            saveToCloud();
          }
          // Réinitialise l'état de glissement après un court délai pour laisser passer l'événement onclick
          setTimeout(() => { el.dataset.justDragged = "false"; }, 50);
        }
      });
    }

    function renderConnections() {
      const svg = document.getElementById('connections-layer');
      svg.innerHTML = '';
      state.links = state.links || [];

      state.links.forEach(link => {
        const impEl = document.getElementById(`card-${link.importerId}`);
        const domEl = document.getElementById(`card-${link.domainId}`);
        if (!impEl || !domEl) return;

        const r1 = impEl.getBoundingClientRect(); const r2 = domEl.getBoundingClientRect();
        const x1 = r1.left + r1.width / 2; const y1 = r1.top + r1.height / 2;
        const x2 = r2.left + r2.width / 2; const y2 = r2.top + r2.height / 2;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const dx = (x2 - x1) / 2;
        path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
        path.setAttribute('class', 'connection-line');
        svg.appendChild(path);
      });
    }

    function toggleLinkingMode() {
      isLinkingMode = !isLinkingMode;
      document.getElementById('btn-toggle-link').classList.toggle('btn-active', isLinkingMode);
      document.getElementById('linking-banner').style.display = isLinkingMode ? 'block' : 'none';
      linkingSource = null;
      renderWorkspace();
    }

    function handleLinkingClick(id, type) {
      if (!linkingSource) {
        linkingSource = { id, type };
        renderWorkspace(); 
        return;
      }
      
      if (linkingSource.id === id) {
        linkingSource = null;
        renderWorkspace();
        return;
      }
      
      if (linkingSource.type !== type) {
        const importerId = type === 'importer' ? id : linkingSource.id;
        const domainId = type === 'domain' ? id : linkingSource.id;

        state.links = state.links || [];
        const idx = state.links.findIndex(l => l.importerId === importerId && l.domainId === domainId);
        
        if (idx >= 0) state.links.splice(idx, 1); 
        else state.links.push({ importerId, domainId });
        
        linkingSource = null;
        renderWorkspace();
        saveToCloud();
      } else {
        linkingSource = { id, type };
        renderWorkspace();
      }
    }

    function openModal(id) {
      const imp = state.importers.find(i => i.id === id);
      if (!imp) return;
      activeModalId = id;

      document.getElementById('m-company-title').innerText = imp.company || 'Nouvel Importateur';
      document.getElementById('m-contact-title').innerText = imp.activity || 'Aucune activité';
      document.getElementById('m-avatar').src = imp.avatar || 'https://via.placeholder.com/65?text=Logo';
      document.getElementById('m-input-company').value = imp.company || '';
      document.getElementById('m-input-contact').value = imp.contact || '';
      document.getElementById('m-input-activity').value = imp.activity || '';
      document.getElementById('m-input-email').value = imp.email || '';
      document.getElementById('m-input-phone').value = imp.phone || '';
      document.getElementById('m-input-avatar').value = imp.avatar || '';
      document.getElementById('m-input-notes').value = imp.notes || '';
      document.getElementById('m-input-domains').value = imp.domainsText || '';

      selectColor(imp.color || 'none', false);
      document.getElementById('info-modal').classList.add('active');
    }

    function selectColor(colorName, doSave = true) {
      document.getElementById('m-input-color').value = colorName;
      document.querySelectorAll('.color-option').forEach(el => {
        el.classList.toggle('selected', el.getAttribute('data-color') === colorName);
      });
      if (doSave) saveModalChanges();
    }

    function closeModal() {
      document.getElementById('info-modal').classList.remove('active');
      activeModalId = null;
    }

    function saveModalChanges() {
      if (!activeModalId) return;
      const imp = state.importers.find(i => i.id === activeModalId);
      if (imp) {
        imp.company = document.getElementById('m-input-company').value;
        imp.contact = document.getElementById('m-input-contact').value;
        imp.activity = document.getElementById('m-input-activity').value;
        imp.email = document.getElementById('m-input-email').value;
        imp.phone = document.getElementById('m-input-phone').value;
        imp.avatar = document.getElementById('m-input-avatar').value;
        imp.notes = document.getElementById('m-input-notes').value;
        imp.domainsText = document.getElementById('m-input-domains').value;
        imp.color = document.getElementById('m-input-color').value;

        renderWorkspace();
        saveToCloud();
        
        document.getElementById('m-company-title').innerText = imp.company || 'Nouvel Importateur';
        document.getElementById('m-contact-title').innerText = imp.activity || 'Aucune activité';
        document.getElementById('m-avatar').src = imp.avatar || 'https://via.placeholder.com/65?text=Logo';
      }
    }

    function autoLayout() {
      const w = window.innerWidth; const h = window.innerHeight;
      state.domains.forEach((d, idx) => { d.x = w - 200 - (Math.floor(idx / 8) * 160); d.y = 100 + ((idx % 8) * 65); });
      state.importers.forEach((imp, idx) => {
        if (idx < 6) { imp.x = 80 + (idx * 230); imp.y = 90; } 
        else if (idx < 12) { imp.x = 80; imp.y = 160 + ((idx - 6) * 75); } 
        else { imp.x = 80 + ((idx - 12) * 230); imp.y = h - 120; }
      });
      renderWorkspace(); saveToCloud();
    }

    function deleteItem(type, id, event) {
      event.stopPropagation();
      if (type === 'domain') {
        state.domains = state.domains.filter(d => d.id !== id); state.links = state.links.filter(l => l.domainId !== id);
      } else {
        state.importers = state.importers.filter(i => i.id !== id); state.links = state.links.filter(l => l.importerId !== id);
      }
      if (linkingSource && linkingSource.id === id) linkingSource = null;
      renderWorkspace(); saveToCloud();
    }

    function openAddModal(type) {
      const name = prompt(`Nom du nouveau ${type === 'domain' ? 'Domaine' : 'Importateur'} :`);
      if (!name) return;
      const id = 'id-' + Date.now();
      if (type === 'domain') state.domains.push({ id, name, region: 'Bourgogne', x: 200, y: 200 });
      else state.importers.push({ id, company: name, contact: '', avatar: '', color: 'none', x: 150, y: 150 });
      renderWorkspace(); saveToCloud();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a'); a.href = dataStr; a.download = "malaisie_2026_backup.json"; a.click();
    }

    function triggerJSONImport() { document.getElementById('file-input').click(); }

    function handleFileSelect(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.domains || parsed.importers) {
            state = parsed; renderWorkspace(); saveToCloud();
          }
        } catch(err) { alert("Format de fichier non reconnu."); }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
